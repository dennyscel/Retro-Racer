name: Importar e publicar Retro Racer

on:
  push:
    branches:
      - main
    paths:
      - .bootstrap/**
      - .github/workflows/import-project.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: retro-racer-bootstrap
  cancel-in-progress: false

jobs:
  import-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Restaurar pacote validado
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > "$RUNNER_TEMP/retro-racer.zip"
          echo "76c0b09bc97434ce2b1e3888185af38d9a70a3fa6ac024d47c3ff6804a43e56e  $RUNNER_TEMP/retro-racer.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/retro-racer"
          unzip -q "$RUNNER_TEMP/retro-racer.zip" -d "$RUNNER_TEMP/retro-racer"
          rsync -a --delete --exclude=.git/ "$RUNNER_TEMP/retro-racer/" ./

      - name: Registrar versão final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AAA_R2+C22"
          git push

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar conteúdo estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar jogo
        id: deployment
        uses: actions/deploy-pages@v4
